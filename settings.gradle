pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
publishing {
    repositories {
        maven {
            name = 'GitHubPages'
            url = uri(providers.gradleProperty('mavenRepoDir')
                    .getOrElse("${rootDir}/build/maven-repository"))
        }
    }
}
rootProject.name = 'time-duration-picker'
include ':time-duration-picker'
