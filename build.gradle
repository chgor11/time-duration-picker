plugins {
    id 'com.android.library' version '8.1.0' apply false
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0' 
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

if (file('local.gradle').exists()) {
    apply from: 'local.gradle'
}
