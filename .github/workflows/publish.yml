name: Build and publish Maven repository

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and publish the release library
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :time-duration-picker:publishReleasePublicationToGitHubPagesRepository \
            -PmavenRepoDir="$GITHUB_WORKSPACE/build/maven-repository"

      - name: Verify Maven artifacts
        run: |
          VERSION="1.1.3-androidx"
          ARTIFACT_DIR="build/maven-repository/com/github/chgor11/time-duration-picker/$VERSION"
          test -s "$ARTIFACT_DIR/time-duration-picker-$VERSION.aar"
          test -s "$ARTIFACT_DIR/time-duration-picker-$VERSION.pom"
          test -s "$ARTIFACT_DIR/time-duration-picker-$VERSION-sources.jar"

      - name: Add GitHub Pages marker
        run: touch build/maven-repository/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/maven-repository

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
