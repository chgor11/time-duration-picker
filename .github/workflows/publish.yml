name: Build and publish Maven repository

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager not found"
              exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --version

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "SDK installation completed successfully"

      - name: Build and publish Maven artifacts
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --no-daemon \
            :time-duration-picker:publishReleasePublicationToGitHubPagesRepository \
            -PmavenRepoDir="$GITHUB_WORKSPACE/build/maven-repository"

      - name: Verify Maven artifacts
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.1.3-androidx"
          ARTIFACT_DIR="build/maven-repository/com/github/chgor11/time-duration-picker/$VERSION"

          test -s "$ARTIFACT_DIR/time-duration-picker-$VERSION.aar"
          test -s "$ARTIFACT_DIR/time-duration-picker-$VERSION.pom"
          test -s "$ARTIFACT_DIR/time-duration-picker-$VERSION-sources.jar"

      - name: Add GitHub Pages marker
        run: touch build/maven-repository/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/maven-repository

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
